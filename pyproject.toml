[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "romakit"
version = "0.1.0"
description = "Per-locale romanization and CJK script detection for lyrics tooling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nnyj" }]
keywords = ["romanization", "romaji", "pinyin", "hangul", "cjk", "lyrics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
  "Natural Language :: Japanese",
  "Natural Language :: Chinese (Simplified)",
  "Natural Language :: Korean",
]
# detect.py is stdlib-only; each romanizer pulls its own stack (extras below)
dependencies = []

[project.optional-dependencies]
jp = ["cutlet", "jaconv", "regex", "opencc"]
zh = ["pypinyin"]
ko = ["korean-romanizer"]

[project.scripts]
romakit = "romakit.__main__:main"

[tool.setuptools.packages.find]
include = ["romakit*"]
